<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — PaulFolio</title>
  <meta name="description" content="Login admin PaulFolio.">
  <meta name="author" content="Paulus Petrus P Sianipar">
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts: Plus Jakarta Sans & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Main CSS stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Ambient Background Dynamic Glows -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <!-- AUTH PAGE CONTENT -->
  <main class="auth-page-main">
    <div class="auth-wrapper auth-wrapper-single">
      <div class="auth-form-panel active" id="loginPanel">
        <a href="index.html" class="logo auth-logo">
          <div class="logo-icon"><i class="fa-solid fa-code"></i></div>
          <span>Paul<span class="gradient-text">Folio</span></span>
        </a>

        <h3 class="auth-form-title">Login Admin</h3>
        <p class="auth-form-subtitle">Masukkan password admin untuk membuka dashboard.</p>

        <div class="auth-alert" id="authAlert" style="display: none;" role="alert">
          <i class="fa-solid fa-circle-info" id="authAlertIcon"></i>
          <span id="authAlertMessage"></span>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="loginPassword" class="form-input" placeholder="Masukkan password"
                autocomplete="current-password" required autofocus>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block" id="loginSubmitBtn">
            <i class="fa-solid fa-right-to-bracket"></i> Masuk
          </button>

          <div class="auth-form-footer">
            <a href="index.html" class="auth-switch-link"><i class="fa-solid fa-arrow-left"></i> Kembali ke beranda</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="api-client.js"></script>
  <script type="module" src="auth.js"></script>
</body>

</html>
